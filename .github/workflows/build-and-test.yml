name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poethepoet poetry coverage
          poetry install

      - name: Run Unit Tests
        run: poe test

      - name: Build Windows Executable
        run: poe build-windows-wine

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTPMounter-Windows-Executable
          path: dist/*.exe
          if-no-files-found: warn
