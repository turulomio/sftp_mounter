name: Build and Test

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 wget xvfb

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install Python Dependencies
        run: |
          poetry install

      - name: Run Unit Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          poetry run poe test

      - name: Setup Wine Python
        env:
          WINEDEBUG: -all
        run: |
          poetry run poe setup-wine-python

      - name: Build Windows Executable
        env:
          WINEDEBUG: -all
        run: |
          poetry run poe build-windows-wine

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTPMounter-Windows-Executable
          path: dist/*.exe
          if-no-files-found: warn
