name: Build and Test

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Wine & System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 wget xvfb libgl1 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers fontconfig fonts-freefont-ttf libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Initialize Wine Environment
        env:
          WINEDEBUG: -all
        run: |
          xvfb-run -a wineboot -u

      - name: Install PoeThePoet & Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poethepoet poetry

      - name: Setup Wine Python (setup-wine-python)
        env:
          WINEDEBUG: -all
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a poe setup-wine-python

      - name: Run Unit Tests under Wine (test)
        env:
          WINEDEBUG: -all
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a poe test

      - name: Build Windows Executable under Wine (build-windows-wine)
        env:
          WINEDEBUG: -all
          QT_OPENGL: software
          QT_QUICK_BACKEND: software
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a poe build-windows-wine

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTPMounter-Windows-Executable
          path: dist/*.exe
          if-no-files-found: warn
